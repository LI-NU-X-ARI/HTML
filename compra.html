<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras</title>
    <link rel="stylesheet" href="PORTAFOLIO/CSS/style-compra.css">
</head>
<body>
    <section>
        <h1 class="Titulo"> COMPRRA ONLINE </h1>
    </section>
    <section>
        <img src="PORTAFOLIO/Imagenes/guindo.jpg" alt="Labial Rose Natural" class="guindo">
    </section>
        <form class="Formulario" id="FormUsu">
            <div class="Datos">
            <label>Producto</label>
            <p>Rosé Natural</p>
            </div>

            <div class="Datos">
            <label>Precio</label>
            <p>Bs. 45</p>
            </div>

            <div class="Datos">
    <label>Cantidad</label>
    <input type="number" id="cantidad" value="1" min="1">
            </div>

            <h2>Total: Bs. <span id="total">45</span></h2>
            <div class="Datos" >
                <label for="nombre"> Nombre </label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    placeholder="Ingrese su nombre" 
                    required >
            </div>
            <div class="Datos" >
                <label for="apellido"> Apellido </label>
                <input 
                    type="text" 
                    id="apellido" 
                    name="apellido"
                    placeholder="Ingrese su apellido" 
                    required >
            </div>
            <div class="Datos" >
                <label for="correo"> Correo </label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="usuario@gmail.com" 
                    required >
            </div>
            <div class="Datos" >
                <label for="telefono"> Telefono </label>
                <input 
                    type="text" 
                    id="telefono" 
                    name="telefono"
                    placeholder="+591 11122233" 
                    required >
            </div>
            <div class="pago">

    <button type="button" id="btnPago">
        Método de pago
    </button>

    <div id="opcionesPago" style="display:none;">

        <h3>Seleccione método de pago</h3>

        <label>
            <input type="radio" name="pago" value="QR" id="qr">
            QR
        </label>

        <br>

        <label>
            <input type="radio" name="pago" value="Efectivo" id="efectivo">
            Efectivo
        </label>

    </div>


    <div id="mostrarQR" style="display:none;">
        <h3>Escanee el código QR</h3>
        <img src="PORTAFOLIO/Imagenes/WhatsApp Image 2026-07-29 at 06.54.17.jpeg" class="qr">
    </div>


    <div id="mostrarEfectivo" style="display:none;">
        <h3>Pago en efectivo</h3>
        <p>Realice el pago al momento de la entrega.</p>
    </div>

</div>
            <div class="botones">
                <button type="submit"> Enviar </button>
            </div>
        </form>
    </section>
    <script src="PORTAFOLIO/JS/script.js"></script>
</body>
</html>
</body>
</html>
